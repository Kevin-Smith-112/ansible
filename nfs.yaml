---
- name: Install and configure the NFS server
  hosts: ansible.lily
  become: true
  gather_facts: true

  vars:
    nfs_export_path: /srv/nfs/share
    nfs_export_options: "*(rw,sync,no_subtree_check,no_root_squash)"

  tasks:
    - name: Install NFS server packages
      ansible.builtin.dnf:
        name:
          - nfs-utils
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure the export directory exists
      ansible.builtin.file:
        path: "{{ nfs_export_path }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: '0777'

    - name: Configure the NFS export
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ nfs_export_path }} {{ nfs_export_options }}"
        create: true
        state: present

    - name: Start and enable NFS services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - rpcbind
        - nfs-server

    - name: Apply the updated NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Open NFS ports in firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - nfs
        - mountd
        - rpc-bind
      when: ansible_facts.services is defined and 'firewalld.service' in ansible_facts.services
