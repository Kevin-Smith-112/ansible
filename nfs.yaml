---
- name: Install and configure the NFS server
  hosts: ansible.lily
  become: true
  gather_facts: true

  vars:
    nfs_export_path: /srv/nfs/share
    nfs_export_options: "*(rw,sync,no_subtree_check,no_root_squash)"

  tasks:
    - name: Install NFS server packages
      ansible.builtin.dnf:
        name:
          - nfs-utils
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure the export directory exists
      ansible.builtin.file:
        path: "{{ nfs_export_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure the NFS export
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ nfs_export_path }} {{ nfs_export_options }}"
        create: true
        state: present

    - name: Start and enable NFS services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - rpcbind
        - nfs-server

    - name: Apply the updated NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Ensure firewalld is installed
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Ensure firewalld is running and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Open NFS services in firewalld
      ansible.builtin.command: firewall-cmd --permanent --add-service={{ item }}
      loop:
        - nfs
        - mountd
        - rpc-bind
      when: ansible_facts['os_family'] == 'RedHat'
      changed_when: true

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      when: ansible_facts['os_family'] == 'RedHat'
      changed_when: true
